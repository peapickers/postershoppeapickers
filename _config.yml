##########
# collectionbuilder-csv
# Jekyll Digital Collection Generator
# https://github.com/CollectionBuilder/collectionbuilder-csv
##########

##########
# URL VARIABLES
#
# site domain, full URL to the production location of your collection
url: 
# path to location on the domain if necessary e.g. /digital/hjccc
baseurl:
# location of code, the full url to your github repository
source-code: https://github.com/CollectionBuilder/collectionbuilder-csv

##########
# SITE SETTINGS
#
# title of site appears in banner
title: peapickers postershop
# printshop-url: zusterproject, gelinkt in menu en footer als het ingevuld is (weggehaald op vraag van Jonas, 4-11-2026)
# tagline, a short phrase that will appear throughout the site in the top banner
tagline: uit de archieven van onafhankelijke kunstenaars
header-title: peapickers postershop
# Winkelmand: publieke API-sleutel van Snipcart (testsleutel tot de vzw is opgericht).
# Leeg = voorbeeldmand in de browser, er wordt niets verkocht.
snipcart-api-key: ""
# Prijsregels (ondernemingsplan v3, 4-11-2026). Prijs per vel (rol / aantal vellen) en richtprijs inkt per afdruk, zoals betaald (Jonas, 5-11-2026): _data/config-prijzen.csv
# M = papier + inkt (geen opslag, dus btw-materiaal = 0); prijs = 7 x M, afgerond op prijs-afronding. Geen btw op de verkoop.
btw-materiaal: 0
prijs-afronding: 0.10
roerende-voorheffing: 0.15
btw-vermelding: "btw-vrijgesteld (bijzondere vrijstellingsregeling kleine ondernemingen)"
# Kosten die de vzw uit haar deel betaalt (aannames A2 en A11 van het ondernemingsplan v3)
verpakking-poster: 0.50
verpakking-fineart: 1.50
betaalkost-schatting: 0.60
# Bestelminimum in de mand, zonder leverkost (niet bij de gedeelde leverronde). Leverregels: _data/config-verzending.csv
bestelminimum: 20
# Limited (VM6, Jonas 7-11-2026): de webshop start met 0 Limited (VB7). false = keuze Limited en filtergroep Limited verborgen tot de eerste Limited gepland is.
limited-actief: false
# Auteursrechten op Posters: vaste betaaldag de 15de van januari, april, juli en oktober (VB8). Valt die in een weekend, dan de werkdag ervoor. Eerste betaling 15-7-2027.
auteursrechten-betaalmaanden: "1,4,7,10"
auteursrechten-betaaldag: 15
eerste-kwartaalbetaling: 2027-07-15
# Herroepingsknop (BESLISSINGEN.md, 7-11-2026). Tekst van de link in de footer van elke pagina.
herroeping-link-tekst: "Hier de overeenkomst herroepen"
# Adres (https) dat een herroeping ontvangt en meteen de ontvangstbevestiging mailt. Leeg = voorbeeld: er wordt niets verstuurd of bewaard.
# Welke dienst dit wordt, is nog een keuze (VT1 in projecten/techniek/vragenlijst-2026-11-07.md op peapickers.github.io).
herroeping-endpoint: ""
# Tweede kans: teruggestuurde Posters (VJ19, VM3). Prijs = 80 % van de oorspronkelijke prijs, afgerond op prijs-afronding; opbrengst 50/50 Auteursrechten en vzw peapickers. Rijen: _data/tweede-kans.csv
tweede-kans-factor: 0.8
# Melding bovenaan de inhoud van elke pagina zolang de teksten niet herschreven zijn (Jonas, 5-11-2026); leeg laten om te verbergen
tekst-melding: "Deels Claude-generated teksten, zodat het idee al overgebracht kan worden. Nog te schrijven."
voorbeeld-strook: "Voorbeeldsite. vzw peapickers is in oprichting (rond januari 2027) en verkoopt pas vanaf het voorjaar van 2027. Alle kunstwerken zijn fictieve placeholders."
# description appears in meta tags and other locations
# this description might appear in search result lists, keep around 160 characters max
description: "Webshop van vzw peapickers in Gent: posters op maat en Limited-prints van onafhankelijke kunstenaars, met een prijs die tot op de cent ontleed is."
# keywords, a short list of subjects describing the collection, separated by semicolon, to appear in rich markup
keywords: posters; kunstwerken; onafhankelijke kunstenaars; Gent
# creator of the digital collection, to appear in meta tags; we typically use our GitHub usernames but feel free to just use your name
author: peapickers

##########
# COLLECTION SETTINGS
#
# Set the metadata for your collection (the name of the CSV file in your _data directory that describes the objects in your collection) 
# Use the filename of your CSV **without** the ".csv" extension! E.g. _data/demo-metadata.csv --> "demo-metadata"
metadata: peapickers-archief
# page generation settings [optional!]
# [optional: only used if you need to tweak CB defaults or generate from more than one data file]
# page_gen:
#   - data: 'demo-metadata'
#     template: 'item'
#     name: 'objectid'
#     dir: 'items'
#     extension: 'html' 
#     filter: 'objectid'  

##########
# ORGANIZATION SETTINGS
#
# Enter name and link for your organization (replacing the name and links below)
# These values will be used in attribution and data 
organization-name: "peapickers"
organization-link: 
# Add logo image links if you would like them to appear in banner and footer. Delete or leave blank to remove logos.
organization-logo-banner: 
organization-logo-nav: 

##########
# ROBOTS EXCLUDE
#
# set noindex to true if you do NOT want Google to index your site
# noindex: true 

##########
# BUILD SETTINGS 
#
# Note: use environment variable on build command to include analytics
# JEKYLL_ENV=production jekyll build
# (this is done automatically by gh-pages build)
#
# Library directory location. This allows you to customize where the standard assets are found.
# provide a relative path in this repository or full url 
lib-assets: /assets/lib
# ignore stuff
exclude: [vendor/, docs/, Rakefile, rakelib/, README.md, LICENSE, CITATION.cff, CODE_OF_CONDUCT.md, CONTRIBUTING.md, SECURITY.md, AGENTS.md, CLAUDE.md, HUMANS.md, BESLISSINGEN.md, LEESMIJ.md]
# compress CSS output
sass:
  style: compressed

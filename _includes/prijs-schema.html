{% comment %} Prijsschema 7 × M, puur als formule zonder voorbeeldbedragen (Jonas, 5-11-2026). {% endcomment %}
<figure class="prijs-schema" aria-label="Prijsopbouw: 7 delen van M">
  <div class="ps-balk">
    <div class="ps-deel ps-materiaal" style="--n:1"><span class="ps-m">1M</span><span class="ps-naam">Materiaalkost</span></div>
    <div class="ps-deel ps-maker" style="--n:3"><span class="ps-m">3M</span><span class="ps-naam">Auteursrechten, bruto</span></div>
    <div class="ps-deel ps-onderneming" style="--n:3"><span class="ps-m">3M</span><span class="ps-naam">vzw peapickers</span></div>
  </div>

  <div class="ps-details">
    <div class="ps-detail ps-d-materiaal" style="--n:1">
      <p class="ps-mobiel">1M · Materiaalkost</p>
      <p>M = papier + inkt</p>
    </div>
    <div class="ps-detail ps-d-maker" style="--n:3">
      <p class="ps-mobiel">3M · Auteursrechten, bruto</p>
      <div class="ps-mini" aria-hidden="true"><span style="flex:85">netto 85 %</span><span style="flex:15">15 %</span></div>
      <p>3M − 15 % roerende voorheffing = 2,55M netto</p>
    </div>
    <div class="ps-detail ps-d-onderneming" style="--n:3">
      <p class="ps-mobiel">3M · vzw peapickers</p>
      <p>7M − 1M − 3M, ± de afronding</p>
    </div>
  </div>

  <figcaption class="ps-totaal">
    <span><strong>Prijs = 7 × M</strong>, afgerond op € 0,10</span>
  </figcaption>
</figure>

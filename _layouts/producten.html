---
# Productoverzicht van Peapickers Postershop: filters altijd open in een kolom links (ongeveer 30%), rechts de beelden als raster of per jaar.
layout: page
custom-foot: js/producten-js.html
---
<div class="mb-3">{{ content }}</div>

<div class="pp-browse">
    <aside class="pp-filters" aria-label="Filters">
        <div class="d-flex justify-content-between align-items-baseline mb-2">
            <h2 class="h5 mb-0">Filters</h2>
            <button type="button" class="btn btn-link btn-sm p-0 text-dark" id="pp-reset">Alles wissen</button>
        </div>
        <label class="visually-hidden" for="pp-zoek">Zoeken</label>
        <input type="search" class="form-control mb-3" id="pp-zoek" placeholder="Zoeken ...">
        <div id="pp-facetten"></div>
    </aside>

    <section class="pp-resultaat" aria-label="Producten">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div id="pp-aantal" class="small" role="status" aria-live="polite"></div>
            <div class="btn-group btn-group-sm" role="group" aria-label="Weergave">
                <input type="radio" class="btn-check" name="pp-weergave" id="pp-w-raster" value="raster" checked>
                <label class="btn btn-outline-dark" for="pp-w-raster">Raster</label>
                <input type="radio" class="btn-check" name="pp-weergave" id="pp-w-jaar" value="jaar">
                <label class="btn btn-outline-dark" for="pp-w-jaar">Per jaar</label>
            </div>
        </div>
        <div id="pp-items"></div>
    </section>
</div>

---
# Productoverzicht van Peapickers Postershop: posters over de volle breedte; filters zitten ingeklapt achter de knop Filters.
layout: default
custom-foot: js/producten-js.html
---
<div class="container pp-container">
<h2 class="visually-hidden">Producten</h2>
<div class="pp-balk d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-dark btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#pp-filterpaneel" aria-expanded="false" aria-controls="pp-filterpaneel" id="pp-filterknop">Filters <span id="pp-filterteller"></span></button>
        <div id="pp-aantal" class="small" role="status" aria-live="polite"></div>
    </div>
</div>

<div class="collapse" id="pp-filterpaneel">
    <aside class="pp-filters" aria-label="Filters">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <label class="visually-hidden" for="pp-zoek">Zoeken</label>
            <input type="search" class="form-control form-control-sm pp-zoek" id="pp-zoek" placeholder="Zoeken ...">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <div class="btn-group btn-group-sm" role="group" aria-label="Weergave">
                    <input type="radio" class="btn-check" name="pp-weergave" id="pp-w-raster" value="raster" checked>
                    <label class="btn btn-outline-dark" for="pp-w-raster">Raster</label>
                    <input type="radio" class="btn-check" name="pp-weergave" id="pp-w-jaar" value="jaar">
                    <label class="btn btn-outline-dark" for="pp-w-jaar">Per jaar</label>
                </div>
                <button type="button" class="btn btn-outline-dark btn-sm" id="pp-shuffle" title="Posters opnieuw in willekeurige volgorde zetten">Shuffle</button>
                <button type="button" class="btn btn-link btn-sm p-0 ms-2 text-dark" id="pp-reset">Alles wissen</button>
            </div>
        </div>
        <div id="pp-facetten"></div>
    </aside>
</div>

<section class="pp-resultaat" aria-label="Producten">
    <div id="pp-items"></div>
</section>
{{ content }}
</div>

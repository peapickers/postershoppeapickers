# Stand van de gedeelde leverronde in Gent, voor postershop én printshop. VOORBEELD.
# De printshop leest dezelfde stand via /leverronde.json. Later werkt een script dit bij uit de echte bestellingen (Snipcart).
# De site toont alleen hoeveel deelnemers er zijn en wanneer de ronde sluit, nooit wie.
wachtenden: 4
vertrek-bij: 10
kost-ronde: 10.00
kost-deelnemer: 1.00
# De ronde vertrekt bij "vertrek-bij" deelnemers, of uiterlijk "termijn-dagen" na de eerste bestelling die erin zit (Jonas, 8-11-2026).
# Leeg laten als er niemand wacht: dan start de volgende klant de ronde en toont de site vandaag + 14 dagen.
eerste-bestelling: 2027-04-06
termijn-dagen: 14
bijgewerkt: 2027-04-08 14:00
# Kalender voor levering op een moment naar keuze (zelfde regels als de printshop).
# Bezette momenten komen uit de agenda via beschikbaarheid.json van de printshop.
kalender:
  beschikbaarheid-url: "https://peapickers.github.io/printshoppeapickers/beschikbaarheid.json"
  min-dagen-vooraf: 3
  dagen-vooruit: 42
  van: "10:00"
  tot: "21:00"
  slot-minuten: 60
